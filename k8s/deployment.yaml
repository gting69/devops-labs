apiVersion: apps/v1
kind: Deployment
metadata:
  name: cats-deployment
  namespace: cats-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cats-web
  template:
    metadata:
      labels:
        app: cats-web
    spec:
      containers:
      - name: web
        image: cats-registry:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DATABASE_URL
        - name: APP_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_ENVIRONMENT
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5