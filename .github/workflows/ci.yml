name: DevOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Додаємо сервіс бази даних прямо в раннер для тестів
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: cats_registry_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Отримання коду репозиторію
        uses: actions/checkout@v4

      - name: Налаштування Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Кешування залежностей pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Встановлення залежностей
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r requirements.txt

      - name: Статичний аналіз коду за допомогою Ruff
        run: |
          ruff check . --ignore=B008

      # Вказуємо змінну середовища для підключення до тестової бази під час запуску pytest
      - name: Запуск тестів (pytest)
        env:
          DATABASE_URL: postgresql://postgres:secretpassword@localhost:5432/cats_registry_db
        run: |
          pytest

      - name: Збірка Docker-образу
        run: |
          docker build -t cats-registry:latest .

  publish-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4

      - name: Авторизація в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Збірка та публікація образу в GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}