apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  namespace: cats-namespace
spec:
  type: {{ .Values.service.type }}
  selector:
    app: cats-web
    release: {{ .Release.Name }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
    nodePort: {{ .Values.service.nodePort }}